<div class="site">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" routerLink="/" (click)="closeMenu()">
        <span class="brand-mark">{{ portfolio.initials }}</span>
        <span>
          <strong>{{ portfolio.shortName }}</strong>
          <small>{{ portfolio.role }}</small>
        </span>
      </a>

      <button
        class="menu-button"
        type="button"
        aria-label="Abrir o cerrar navegación"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
      </button>

      <nav class="main-nav" [class.is-open]="menuOpen()">
        <a
          routerLink="/"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
        >
          Inicio
        </a>
        <a
          routerLink="/perfil"
          routerLinkActive="is-active"
          (click)="closeMenu()"
        >
          Perfil
        </a>
        <a
          routerLink="/tecnologias"
          routerLinkActive="is-active"
          (click)="closeMenu()"
        >
          Tecnologías
        </a>
        <a
          routerLink="/proyectos"
          routerLinkActive="is-active"
          (click)="closeMenu()"
        >
          Proyectos
        </a>
        <a
          class="nav-contact"
          routerLink="/contacto"
          routerLinkActive="is-active"
          (click)="closeMenu()"
        >
          Contacto
        </a>
      </nav>
    </div>
  </header>

  <main>
    <router-outlet />
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <strong>{{ portfolio.shortName }}</strong>
        <p>{{ portfolio.role }} · {{ portfolio.location }}</p>
      </div>

      <div class="footer-links">
        <a [href]="'mailto:' + portfolio.contact.email">Correo</a>
        <a
          [href]="portfolio.contact.githubUrl"
          target="_blank"
          rel="noreferrer"
        >
          GitHub
        </a>
        <a
          [href]="portfolio.contact.linkedinUrl"
          target="_blank"
          rel="noreferrer"
        >
          LinkedIn
        </a>
      </div>

      <span class="footer-copy">© 2026</span>
    </div>
  </footer>
</div>
